<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Scanner</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  background: #0f0f13;
  color: #fff;
  font-family: Arial;
  margin: 0;
  padding: 20px;
}

button {
  padding: 15px;
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  font-size: 16px;
}

.start { background: #00d68f; }
.stop { background: #ff4757; }

.card {
  background: #1a1a22;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}

.order-entry {
  background: #22222e;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
}

.order-link {
  color: orange;
  display: inline-block;
  margin-top: 5px;
}

.orders-empty {
  color: #777;
}

.stat {
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>⚡ P2P Scanner</h2>

<button id="mainBtn" class="start" onclick="toggleScanner()">▶ Запустить</button>

<div class="card">
  <p>💰 Сумма:</p>
  <input id="amountInput" type="number" value="3000" style="width:100%;padding:10px;">
</div>

<div class="card">
  <div class="stat">📦 Проверено: <span id="statChecked">0</span></div>
  <div class="stat">🔥 Найдено: <span id="statFound">0</span></div>
</div>

<div class="card">
  <h3>Ордера</h3>
  <div id="ordersList">
    <div class="orders-empty">Ордера появятся здесь</div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.setHeaderColor('#0f0f13'); tg.setBackgroundColor('#0f0f13'); }

// ── STATE ──
let state = { running: false, mode: 'exact', blacklist: true, priceFilter: false, amount: '2500', maxPrice: '82' };
let orders = [];
let statChecked = 0;
let statFound = 0;

// ── LOAD/SAVE ──
function loadState() {
  try {
    orders = JSON.parse(localStorage.getItem('scanner_orders') || "[]");
    statChecked = parseInt(localStorage.getItem('checked') || "0");
    statFound = parseInt(localStorage.getItem('found') || "0");
  } catch {}
}

function saveState() {
  localStorage.setItem('scanner_orders', JSON.stringify(orders.slice(0,50)));
  localStorage.setItem('checked', statChecked);
  localStorage.setItem('found', statFound);
}

// ── РЕНДЕР ──
function renderOrders() {
  const list = document.getElementById('ordersList');

  if (!orders.length) {
    list.innerHTML = '<div class="orders-empty">Ордера появятся здесь</div>';
    return;
  }

  list.innerHTML = orders.map(o => `
    <div class="order-entry">
      <div class="order-top">
        <div class="order-nick">👤 ${o.nick}</div>
        <div class="order-time">${o.time}</div>
      </div>
      <div class="order-row">
        <span class="order-badge badge-amber">💰 ${o.price}</span>
        <span class="order-badge badge-blue">📊 ${o.min}–${o.max}</span>
      </div>
      <div class="order-remark">${o.remark || ''}</div>
      <a class="order-link" href="${o.link}" target="_blank">Открыть</a>
    </div>
  `).join('');

  document.getElementById('statFound').innerText = statFound;
  document.getElementById('statChecked').innerText = statChecked;
}

// ── ДОБАВЛЕНИЕ ОРДЕРА ──
function addOrder(o) {
  // ❗ анти-дубль
  if (orders.find(x => x.id === o.id)) return;

  orders.unshift(o);

  if (orders.length > 50) orders.pop();

  statFound++;

  saveState();
  renderOrders();
}

// ── ПРИЕМ ДАННЫХ ОТ БОТА ──
window.addEventListener("message", (e) => {
  try {
    const data = JSON.parse(e.data);

    if (data.type === "order") {
      addOrder(data.order);
    }

    if (data.type === "stats") {
      statChecked = data.checked;
      document.getElementById('statChecked').innerText = statChecked;
      saveState();
    }

  } catch {}
});

// ── КНОПКА ──
function toggleScanner() {
  const amt = document.getElementById('amountInput').value;

  state.running = !state.running;

  tg.sendData(JSON.stringify({
    running: state.running,
    amount: amt
  }));
}

// ── INIT ──
loadState();
renderOrders();
</script>
</body>
</html>
