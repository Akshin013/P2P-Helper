<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Scanner</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  background: #0f0f13;
  color: #fff;
  font-family: Arial;
  margin: 0;
  padding: 20px;
}

button {
  padding: 15px;
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  font-size: 16px;
}

.start { background: #00d68f; }
.stop { background: #ff4757; }

.card {
  background: #1a1a22;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}

.order-entry {
  background: #22222e;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
}

.order-link {
  color: orange;
  display: inline-block;
  margin-top: 5px;
}

.orders-empty {
  color: #777;
}

.stat {
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>⚡ P2P Scanner</h2>

<button id="mainBtn" class="start" onclick="toggleScanner()">▶ Запустить</button>

<div class="card">
  <p>💰 Сумма:</p>
  <input id="amountInput" type="number" value="3000" style="width:100%;padding:10px;">
</div>

<div class="card">
  <div class="stat">📦 Проверено: <span id="statChecked">0</span></div>
  <div class="stat">🔥 Найдено: <span id="statFound">0</span></div>
</div>

<div class="card">
  <h3>Ордера</h3>
  <div id="ordersList">
    <div class="orders-empty">Ордера появятся здесь</div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

// состояние
let state = {
  running: false,
  amount: "3000"
};

let orders = [];
let statChecked = 0;
let statFound = 0;

// загрузка
function loadState(){
  try{
    orders = JSON.parse(localStorage.getItem("orders") || "[]");

    const stats = JSON.parse(localStorage.getItem("stats") || "{}");
    statChecked = stats.checked || 0;
    statFound = stats.found || 0;
  }catch(e){}
}

// сохранение
function saveState(){
  localStorage.setItem("orders", JSON.stringify(orders.slice(0,50)));
  localStorage.setItem("stats", JSON.stringify({
    checked: statChecked,
    found: statFound
  }));
}

// добавление ордера
function addOrder(o){
  if(!o) return;

  // защита от дублей
  if(orders.find(x => x.link === o.link)) return;

  orders.unshift(o);

  if(orders.length > 50) orders.pop();

  statFound++;
  saveState();
  render();
}

// рендер
function render(){
  const list = document.getElementById("ordersList");

  if(!orders.length){
    list.innerHTML = '<div class="orders-empty">Ордера появятся здесь</div>';
  } else {
    list.innerHTML = orders.map(o => `
      <div class="order-entry">
        👤 ${o.nick}<br>
        💰 ${o.price}<br>
        📊 ${o.min}-${o.max}<br>
        <a class="order-link" href="${o.link}" target="_blank">🔗 Открыть</a>
      </div>
    `).join("");
  }

  document.getElementById("statChecked").textContent = statChecked;
  document.getElementById("statFound").textContent = statFound;

  const btn = document.getElementById("mainBtn");

  if(state.running){
    btn.className = "stop";
    btn.innerText = "⛔ Остановить";
  } else {
    btn.className = "start";
    btn.innerText = "▶ Запустить";
  }
}

// кнопка старт/стоп
function toggleScanner(){
  state.running = !state.running;
  state.amount = document.getElementById("amountInput").value;

  sendToBot();
  render();
}

// отправка в бота
function sendToBot(){
  if(tg){
    tg.sendData(JSON.stringify({
      running: state.running,
      amount: state.amount
    }));
  }
}

// получение данных от бота
function syncFromURL(){
  try{
    const params = new URLSearchParams(window.location.search);

    if(params.get("checked")){
      statChecked = parseInt(params.get("checked")) || statChecked;
    }

    if(params.get("found")){
      statFound = parseInt(params.get("found")) || statFound;
    }

    const orderParam = params.get("order");

    if(orderParam){
      const order = JSON.parse(decodeURIComponent(orderParam));

      addOrder(order);

      // убираем из URL чтобы не дублировалось
      window.history.replaceState({}, document.title, window.location.pathname);
    }

  }catch(e){
    console.log("Ошибка:", e);
  }
}

// INIT
loadState();
syncFromURL();
render();
</script>

</body>
</html>
