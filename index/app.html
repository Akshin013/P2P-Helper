<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

// состояние
let state = {
  running: false,
  amount: "2500"
};

let orders = [];
let statChecked = 0;
let statFound = 0;

// загрузка
function loadState() {
  try {
    const o = localStorage.getItem("orders");
    if (o) orders = JSON.parse(o);

    const s = localStorage.getItem("stats");
    if (s) {
      const parsed = JSON.parse(s);
      statChecked = parsed.checked || 0;
      statFound = parsed.found || 0;
    }
  } catch {}
}

// сохранение
function saveState() {
  localStorage.setItem("orders", JSON.stringify(orders.slice(0, 50)));
  localStorage.setItem("stats", JSON.stringify({
    checked: statChecked,
    found: statFound
  }));
}

// добавление ордера
function addOrder(o) {
  if (!o) return;

  // ❌ защита от дублей
  const exists = orders.some(x => x.link === o.link);
  if (exists) return;

  orders.unshift(o);

  if (orders.length > 50) orders.pop();

  statFound++;
  saveState();
  renderOrders();
  renderStats();
}

// рендер ордеров
function renderOrders() {
  const list = document.getElementById("ordersList");

  if (!orders.length) {
    list.innerHTML = '<div class="orders-empty">Ордера появятся здесь</div>';
    return;
  }

  list.innerHTML = orders.map(o => `
    <div class="order-entry">
      <div class="order-top">
        <div class="order-nick">👤 ${o.nick}</div>
        <div class="order-time">${o.time}</div>
      </div>

      <div class="order-row">
        <span class="order-badge badge-amber">💰 ${o.price}</span>
        <span class="order-badge badge-blue">📊 ${o.min}-${o.max}</span>
      </div>

      <div class="order-remark">📝 ${o.remark || "—"}</div>

      <a class="order-link" href="${o.link}" target="_blank">
        🔗 Открыть
      </a>
    </div>
  `).join("");
}

// статистика
function renderStats() {
  document.getElementById("statChecked").textContent = statChecked;
  document.getElementById("statFound").textContent = statFound;
}

// 🔥 ГЛАВНОЕ — получение ордера из бота
function syncFromURL() {
  try {
    const params = new URLSearchParams(window.location.search);

    // статистика
    if (params.get("checked")) {
      statChecked = parseInt(params.get("checked")) || statChecked;
    }

    if (params.get("found")) {
      statFound = parseInt(params.get("found")) || statFound;
    }

    // ордер
    const orderParam = params.get("order");

    if (orderParam) {
      const order = JSON.parse(decodeURIComponent(orderParam));

      addOrder(order);

      // ❗ удаляем чтобы не дублировалось
      window.history.replaceState({}, document.title, window.location.pathname);
    }

  } catch (e) {
    console.log("sync error", e);
  }
}

// очистка
function clearOrders() {
  orders = [];
  statChecked = 0;
  statFound = 0;

  saveState();
  renderOrders();
  renderStats();
}

// INIT
loadState();
syncFromURL();
renderOrders();
renderStats();
</script>
