<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{background:#0f0f13;color:#fff;font-family:sans-serif;padding:20px}
.card{background:#1a1a22;padding:15px;border-radius:12px;margin-bottom:12px}
.trow{display:flex;justify-content:space-between;align-items:center;margin:10px 0;cursor:pointer}
.sw{width:40px;height:22px;background:#333;border-radius:11px;position:relative}
.sw.on{background:#00d68f}
.sw::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
.sw.on::after{transform:translateX(18px)}
button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold}
.start{background:#00d68f}
.stop{background:#ff4757;color:#fff}
</style>
</head>

<body>

<h2>⚡ P2P Scanner</h2>

<button id="mainBtn" class="start" onclick="toggleScanner()">▶ Запустить</button>

<div class="card">
  <div>💰 Сумма</div>
  <input id="amtInput" type="number" placeholder="2500" style="width:100%;padding:8px">
</div>

<div class="card">
  <div>📉 Макс курс</div>
  <input id="priceInput" type="number" placeholder="82" style="width:100%;padding:8px">
</div>

<div class="card">
  <div class="trow" onclick="tog('blacklist')">
    <span>🏦 Блок Т-банка</span>
    <div class="sw" id="sw-blacklist"></div>
  </div>

  <div class="trow" onclick="tog('priceFilter')">
    <span>📉 Фильтр по цене</span>
    <div class="sw" id="sw-priceFilter"></div>
  </div>

  <!-- 👇 НОВЫЙ ФИЛЬТР -->
  <div class="trow" onclick="tog('onePerson')">
    <span>👤 Только 1 лицо</span>
    <div class="sw" id="sw-onePerson"></div>
  </div>
</div>

<button onclick="save()">💾 Сохранить</button>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.expand();}

let S = {
  running:false,
  blacklist:true,
  priceFilter:false,
  onePerson:false, // 👈 новый фильтр
  amount:'2500',
  maxPrice:'82'
};

function render(){
  document.getElementById('amtInput').value = S.amount;
  document.getElementById('priceInput').value = S.maxPrice;

  document.getElementById('sw-blacklist').classList.toggle('on', S.blacklist);
  document.getElementById('sw-priceFilter').classList.toggle('on', S.priceFilter);
  document.getElementById('sw-onePerson').classList.toggle('on', S.onePerson);

  const btn = document.getElementById('mainBtn');
  btn.className = S.running ? 'stop' : 'start';
  btn.textContent = S.running ? '⏹ Остановить' : '▶ Запустить';
}

function tog(k){
  S[k] = !S[k];
  render();
}

function toggleScanner(){
  S.running = !S.running;
  send();
  render();
}

function save(){
  S.amount = document.getElementById('amtInput').value || '2500';
  S.maxPrice = document.getElementById('priceInput').value || '82';
  send();
}

function send(){
  if(tg){
    tg.sendData(JSON.stringify({
      running:S.running,
      amount:S.amount,
      maxPrice:S.maxPrice,
      blacklist:S.blacklist,
      priceFilter:S.priceFilter,
      onePerson:S.onePerson // 👈 отправка в бота
    }));
  }
}

render();
</script>

</body>
</html>
